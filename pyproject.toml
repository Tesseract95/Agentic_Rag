[project]
name = "agentic_rag"
version = "0.1.0"
description = "Collection of RAG (Retrieval Augmented Generation) implementations including Naive RAG, CRAG, Modular RAG, and Multi-Agent RAG systems"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.0.20",
    "langchain-pinecone>=0.1.0",
    "langchain-core>=0.1.23",
    "langchain-text-splitters>=0.0.1",
    "pinecone>=5.0.0",
    "langgraph>=0.0.20",
    "tavily-python>=0.3.0",
    "pydantic>=2.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = []
